services:
  tv-telegram-control:
    build: .
    container_name: ${TV_BOT_CONTAINER_NAME:-tv-telegram-control}
    network_mode: host
    user: "${TV_BOT_UID:-1000}:${TV_BOT_GID:-1000}"
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    environment:
      PYTHONUNBUFFERED: "1"
      HOME: /app/home
      TV_BOT_ADB_PATH: /usr/bin/adb
      TV_BOT_CONFIG: /app/data/config.json
      TV_BOT_STATE: /app/data/state.json
      TV_BOT_HISTORY: /app/data/history.jsonl
      TV_BOT_TOKEN_FILE: /run/secrets/telegram_token
      TV_BOT_LOG_DIR: /app/logs
      TV_BOT_HEARTBEAT: /tmp/tv_bot_heartbeat
      TZ: ${TV_BOT_TIMEZONE:-UTC}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./adb:/app/home/.android
    secrets:
      - telegram_token

secrets:
  telegram_token:
    file: ./secrets/telegram_token
